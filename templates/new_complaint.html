{% extends "base.html" %}
{% block title %}Report an issue | FixFlow{% endblock %}
{% block content %}
<div class="form-layout">
  <div><span class="eyebrow">STUDENT WORKSPACE</span><h1>Report a maintenance issue</h1><p class="muted">Share a few details so the right team can take a look.</p></div>
  <form class="panel complaint-form" method="post" enctype="multipart/form-data">
    <label>Issue category<select name="category" required><option value="">Choose a category</option><option>Electrical</option><option>Plumbing / Water</option><option>Cleanliness</option><option>Internet / Wi-Fi</option><option>Furniture</option><option>Classroom / Lab</option><option>Other</option></select></label>
    <label>Exact location<input name="location" required placeholder="e.g. Hostel Block A, Room 204"></label>
    <label>Describe the problem<textarea name="description" rows="4" required placeholder="Briefly explain what happened..."></textarea></label>
    <label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select><small class="help">Choose High only if the issue needs urgent attention.</small></label>
    <label>Attach a photo (optional)<input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp"><small class="help">JPG, PNG or WEBP · Maximum 3 MB</small></label>
    <div class="form-actions"><a class="text-link" href="{{ url_for('dashboard') }}">Cancel</a><button class="button" type="submit">Submit complaint →</button></div>
  </form>
</div>
{% endblock %}
